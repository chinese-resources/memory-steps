name: build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/smoke_test.py
      - run: python3 scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: memory-steps-release
          path: dist/*
